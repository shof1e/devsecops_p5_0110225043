rules:
  - id: custom-no-eval
    languages: [python]
    severity: ERROR
    message: Hindari eval() pada data dinamis; bisa menyebabkan code injection.
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")

  - id: custom-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: subprocess dengan shell=True rentan command injection.
    pattern: subprocess.$FUNC(..., shell=True, ...)
